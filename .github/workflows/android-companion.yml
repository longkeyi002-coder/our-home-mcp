name: Android Companion

on:
  workflow_dispatch:
  push:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-companion

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android-companion/**/*.gradle*

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Run JVM tests and assemble debug APK
        run: ./gradlew :app:test :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-companion-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
