name: AI Life Companion Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-companion

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android-companion/**/*.gradle*

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # This workflow validates source only. Its runner-local debug key is not a
      # stable user signing identity, so it intentionally does not publish an APK.
      # User-installable builds come from android-stable-apk.yml.
      - name: Test, lint and assemble debug APK
        run: ./gradlew :app:test :app:lint :app:assembleDebug --no-daemon --stacktrace
