name: Android Firebase Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-companion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::Missing repository secret GOOGLE_SERVICES_JSON_B64"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          if ! grep -q '"package_name": "com.hermes.companion"' app/google-services.json; then
            echo "::error::google-services.json does not target com.hermes.companion"
            exit 1
          fi

      - name: Test Firebase integration, assemble and lint
        run: ./gradlew test assembleDebug lint --stacktrace

      - name: Verify Firebase resources were generated
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "Firebase debug build validated."
          echo "This workflow intentionally does not publish an APK because runner debug signing is not stable."
          echo "Use Our Home Android Stable APK for user-installable builds."
