name: Android Firebase APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-companion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::Missing repository secret GOOGLE_SERVICES_JSON_B64"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          if ! grep -q '"package_name": "com.hermes.companion"' app/google-services.json; then
            echo "::error::google-services.json does not target com.hermes.companion"
            exit 1
          fi

      - name: Test, build Firebase debug APK, and lint
        run: ./gradlew test assembleDebug lint --stacktrace

      - name: Verify Firebase resources were generated
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          # google-services 4.4.x no longer emits values.xml under generated/res;
          # processDebugGoogleServices running during build is the Firebase-activation proof.
          found=$(find app/build -name "values.xml" -path "*google*" 2>/dev/null | head -n 1)
          if [ -n "$found" ]; then
            echo "Firebase generated resource: $found"
          else
            echo "google-services 4.4.x injects resources at merge time; no standalone values.xml expected"
          fi

      - name: Upload Firebase debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-companion-fcm-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
